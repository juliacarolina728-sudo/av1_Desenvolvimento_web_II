<body>
 <div class="top-bar"></div>
 
 <div class="header-blue">

  <div class="content-card">
  <h1 style="text-align: center; margin-top: 2%; color: #0b0edf; padding: 1%;">MetalMecânica Fretes</h1>
  <br><br>
  <div class="placeholder-bar"></div>
  <img class="main-image" src="" alt="Mecânico trabalhando no motor do carro">

  
  <div class="pedido-trigger-card" id="btnAbrirModal">
    <div class="card-top">
      <span class="card-action-icon"></span>
    </div>
    <h3 class="card-title">Novo Pedido</h3>
    <p class="card-desc">Clique para cadastrar as informações de um novo pedido de entrega.</p>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" type="button">&times;</button>

    <div class="modal-decor"></div>

    <div class="modal-form-panel">
      <h2 class="modal-title">Novo Pedido</h2>
      <p class="modal-subtitle">Preencha as informações do pedido de entrega</p>

      <form class="modal-form" id="pedidoForm">
        <label for="nome">Nome do cliente</label>
        <input type="text" id="nome" name="nome" required>

        <label for="endereco">Endereço de entrega</label>
        <input type="text" id="endereco" name="endereco" required>

        <button type="submit" class="modal-submit">CADASTRAR</button>
      </form>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
