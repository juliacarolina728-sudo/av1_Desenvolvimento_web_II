<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <title>av1</title>
</head>
<body>
 <div class="top-bar"></div>
 
 <div class="header-blue">
    <nav class="tabs">
      <a href="index.html" class="tab">Atividade 1</a>
      <a href="atividade2.html" class="tab">Atividade 2</a>
      <a href="atividade3.html" class="tab">Atividade 3</a>
      <a href="ativ4.html" class="tab">Atividade 4</a>
      <a href="ativ5.html" class="tab">Atividade 5</a>
      <a href="ativ6.html" class="tab">Atividade 6</a>
    </nav>
  </div>
 
  <div class="content-card">
  <h1 style="text-align: center; margin-top: 2%; color: #0b0edf; padding: 1%;">MetalMecânica Fretes</h1>
  <br><br>
  <div class="placeholder-bar"></div>
  <img class="main-image" src="imagem/mecanico.jpeg" alt="Mecânico trabalhando no motor do carro">

  
  <div class="pedido-trigger-card" id="btnAbrirModal">
    <div class="card-top">
      <span class="card-action-icon"></span>
    </div>
    <h3 class="card-title">Novo Pedido</h3>
    <p class="card-desc">Clique para cadastrar as informações de um novo pedido de entrega.</p>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" type="button">&times;</button>

    <div class="modal-decor"></div>

    <div class="modal-form-panel">
      <h2 class="modal-title">Novo Pedido</h2>
      <p class="modal-subtitle">Preencha as informações do pedido de entrega</p>

      <form class="modal-form" id="pedidoForm">
  <label for="codigo">Código do pedido</label>
  <input type="text" id="codigo" name="codigo" required>
  
  <label for="precoCombustivel">Preço do litro de combustível (R$)</label>
  <input type="text" id="precoCombustivel" step="0.01" min="0">
  
  <label for="regiao">Região</label>
  <select id="regiao" name="regiao" required>
    <option value="">Selecione...</option>
    <option value="1">Sudeste (R$ 1,20/peça)</option>
    <option value="2">Sul (R$ 1,30/peça)</option>
    <option value="3">Centro-Oeste (R$ 1,50/peça)</option>
  </select>

  <label for="distancia">Distância (km)</label>
  <input type="number" id="distancia" name="distancia" min="0" required>

  <label for="quantidade">Quantidade de peças</label>
  <input type="number" id="quantidade" name="quantidade" min="1" required>

  <label for="rastreamento">
    <input type="checkbox" id="rastreamento" name="rastreamento">
    Deseja rastreamento? (+ R$ 200)
  </label>

  <button type="submit" class="modal-submit">CADASTRAR</button>
</form>

<script src="scripts/script.js"></script>
</body>
</html>
