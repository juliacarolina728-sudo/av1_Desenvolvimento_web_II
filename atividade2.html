<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style2.css">
    <title>av1</title>
</head>
<body>
<div class="top-bar"></div>

<div class="header-maroon">
    <nav class="tabs">
      <a href="index.html" class="tab">Atividade 1</a>
      <a href="atividade2.html" class="tab">Atividade 2</a>
      <a href="atividade3.html" class="tab">Atividade 3</a>
      <a href="ativ4.html" class="tab">Atividade 4</a>
      <a href="ativ5.html" class="tab">Atividade 5</a>
      <a href="ativ6.html" class="tab">Atividade 6</a>
    </nav>
  </div>

  <div class="content-card">
  <h1 style="font-family: 'Lilita One', cursive; text-align: center; margin-top: 4%; color: #911b1b; padding: 2%; font-size: 60px">Gere seu holerite</h1><br><br>
  <div class="placeholder-bar"></div>
  <img class="main-image" src="imagem/Gemini_Generated_Image_yl6ihiyl6ihiyl6i.jpg" alt="Holerite">

  <div class="holerite-trigger-card" id="btnAbrirModal">
    <div class="card-top">
      <span class="card-action-icon"></span>
    </div>
    <h3 class="card-title">Gere seu holerite</h3>
    <p class="card-desc">Clique para gerar seu holerite.</p>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" type="button">&times;</button>

    <div class="modal-decor"></div>

    <div class="modal-form-panel">
      <h2 class="modal-title">Gere seu holerite</h2>
      <h3 class="modal-subtitle">Preencha as informações do holerite</h3>

      <form class="modal-form" id="holeriteForm">
        <label for="codigo">Código do Funcionario:</label>
        <input type="text" id="codigo" name="codigo" required>

        <label for="horasTrabalhadas">Horas Trabalhadas:</label>
        <input type="number" id="horasTrabalhadas" name="horasTrabalhadas" required>

        <label for="categoria">Categoria:</label>
        <select id="categoria" name="categoria" required>
          <option value="">Selecione...</option>
          <option value="F">F</option>
          <option value="G">G</option>
          
        </select>
        <label for="salarioMinimo">Salário Mínimo:</label>
        <input type="number" id="salarioMinimo" name="salarioMinimo" step="0.01" required>
        <label for="turno">Turno:</label>
        <select id="turno" name="turno" required>
          <option value="">Selecione...</option>
          <option value="Matutino">Matutino</option>
          <option value="Vespertino">Vespertino</option>
          <option value="Noturno">Noturno</option>
        </select>

        <label for="avaliacao">Avaliação:</label>
        <input type="number" id="avaliacao" name="avaliacao" step="1" min="0" max="10" required>

        <button type="submit" class="modal-submit">GERAR</button>
      </form>
    </div>
  </div>
</div>

<script src="script2.js"></script>
</body>
</html>
