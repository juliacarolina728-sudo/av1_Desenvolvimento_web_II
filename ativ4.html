<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style4.css">
    <title>av1</title>
</head>
<body>
<div class="top-bar"></div>

<div class="header-maroon">
    <nav class="tabs">
      <a href="index.html" class="tab">Atividade 1</a>
      <a href="atividade2.html" class="tab">Atividade 2</a>
      <a href="atividade3.html" class="tab">Atividade 3</a>
      <a href="ativ4.html" class="tab">Atividade 4</a>
      <a href="ativ5.html" class="tab">Atividade 5</a>
      <a href="ativ6.html" class="tab">Atividade 6</a>
    </nav>
  </div>

  <div class="content-card">
  <h1 style="font-family: 'Lilita One', cursive; text-align: center; margin-top: 4%; color: #7a3b2e; padding: 2%; font-size: 60px">Tarifa Dinâmica HOTEL</h1><br><br>
  <div class="placeholder-bar"></div>
  <img class="main-image" src="imagem/hotel_sign_illustration.png" alt="Hotel">

  <div class="pedido-trigger-card" id="btnAbrirModal">
    <div class="card-top">
      <span class="card-action-icon"></span>
    </div>
    <h3 class="card-title">Tarifa Dinâmica</h3>
    <p class="card-desc">Clique para calcular tarifa.</p>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" type="button">&times;</button>

    <div class="modal-decor"></div>

    <div class="modal-form-panel">
      <h2 class="modal-title">Reservas Dinâmicas</h2>
      <h3 class="modal-subtitle">Preencha as informações</h3>

      <form class="modal-form" id="hotelForm">
        <label for="base">Informe valor base</label>
        <input type="number" id="base" name="base" min="1" required>
        <label for="cafe">Valor do café da manhã</label>
        <input type="number" id="cafe" name="cafe" min="1" required>
        
        <label for="codigo">Informe código de reserva</label>
        <input type="text" id="codigo" name="codigo" required>
        <label for="quarto">Informe tipo de quarto</label>
        <select id="quarto" name="quarto" required>
        <option value="">Selecione quarto...</option>
        <option value="s">Standard</option>
        <option value="l">Luxo</option>
        <option value="p">Premium</option> 
        </select>
        
      
        <label for="temporada">Temporada</label>
        <select id="temporada" name="temporada" required>
        <option value="b">Baixa</option>
        <option value="a">Alta</option>
        <option value="f">Feriado</option>
        </select>

        <label for="diaria">Informe quantidade diárias</label>
        <input type="number" id="diaria" name="diaria" min="1" required>

        <label for="numero">Informe número de hospedes</label>
        <input type="number" id="numero" name="numero" min="1" required>

         <label for="manha">
         <input type="checkbox" id="manha" name="rastreamento">
         Café da manhã incluso?
        </label>

       <button type="button" id="btnRelatorio" class="modal-submit ">Gerar relatorio Pedido</button>
       <button type="submit" class="modal-submit">Cadastrar Pedido</button>
      </form>
    </div>
  </div>
</div>

<script src="scripts/script4.js"></script>
</body>
</html>
