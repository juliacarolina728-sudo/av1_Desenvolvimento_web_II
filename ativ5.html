<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style5.css">
    <title>av1</title>
</head>
<body>
 <div class="top-bar"></div>

 <div class="header-blue">
    <nav class="tabs">
      <a href="index.html" class="tab">Atividade 1</a>
      <a href="atividade2.html" class="tab">Atividade 2</a>
      <a href="atividade3.html" class="tab">Atividade 3</a>
      <a href="ativ4.html" class="tab">Atividade 4</a>
      <a href="ativ5.html" class="tab">Atividade 5</a>
      <a href="ativ6.html" class="tab">Atividade 6</a>
    </nav>
  </div>

  <div class="content-card">
  <h1 style="text-align: center; margin-top: 2%; color: #0b0edf; padding: 1%;">Sistema de Treinos Esportivos com Carga e Risco de Lesão.</h1>
  <br><br>
  <div class="placeholder-bar"></div>
  <img class="main-image" src="imagem/futebol.jpg" alt="add imagem aqui">

  <div class="pedido-trigger-card" id="btnAbrirModal">
    <div class="card-top">
      <span class="card-action-icon"></span>
    </div>
    <h3 class="card-title">Novo treino</h3>
    <p class="card-desc">Clique para cadastrar novo treino semanal.</p>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" type="button">&times;</button>

    <div class="modal-decor"></div>

    <div class="modal-form-panel">
      <h2 class="modal-title">Novo Treino</h2>
      <p class="modal-subtitle">Preencha as informações a seguir.</p>

      <form class="modal-form" id="esporteForm">
        <label for="pontos">Carga Máxima semanal recomendada</label>
        <input type="number" id="pontos" name="pontos" required>

        <label for="codigo">Código jogador</label>
        <input type="text" id="codigo" name="codigo" required>

        <label for="nome">Nome jogador</label>
        <input type="text" id="nome" name="nome" required>

        <label for="posicao">Posição</label>
        <select id="posicao" name="posicao" required>
        <option value="g">Goleiro</option>
        <option value="z">Zagueiro</option>
        <option value="m">Meio Campo</option>
        <option value="a">Atacante</option>
        </select>

        <label for="tipo">Tipo</label>
        <select id="tipo">
    <option value="F">Físico</option>
    <option value="T">Técnico</option>
    <option value="E">Estratégico</option>
</select>

        <label for="duracao">Duração em minutos</label>
        <input type="number" id="duracao" name="duracao" required>
        
        <label for="avaliacao">Intensidade:</label>
        <input type="number" id="intensidade" name="intensidade" step="1" min="0" max="10" required>
        
         <button type="submit" class="modal-submit">Cadastrar Treino</button>
         <button type="button" id="btnRelatorio" class="modal-submit ">Gerar Relatório</button>
      </form>
    </div>
  </div>
</div>

<script src="scripts/script5.js"></script>
</body>
</html>
